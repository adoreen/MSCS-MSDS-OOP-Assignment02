[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "advent2026-miniprojects"
version = "0.1.0"
description = "OOP with Python, Assignment 2 (Advent 2026): weather forecast client and Uganda tax engine"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
